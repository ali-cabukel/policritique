name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  PROJECT_ID: project-837fb0e4-3ce2-42cf-be2
  PROJECT_NUMBER: "124575765453"
  REGION: europe-west2
  REPOSITORY: dockerhub
  IMAGE: policritique
  SERVICE: policritique
  COLLECT_JOB: policritique-collect-data
  WORKLOAD_IDENTITY_PROVIDER: projects/124575765453/locations/global/workloadIdentityPools/github/providers/github-oidc
  SERVICE_ACCOUNT: cloud-run-deployer@project-837fb0e4-3ce2-42cf-be2.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}" \
            --platform=managed \
            --service-account="${{ env.SERVICE_ACCOUNT }}" \
            --port=8000 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=300 \
            --min-instances=0 \
            --max-instances=1 \
            --update-env-vars="API_HOST=0.0.0.0,STATIC_DIR=/app/static,LLM_PROVIDER=openai,DATABASE_SCHEMA=policritique" \
            --set-secrets="SECRET_KEY=SECRET:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest"

      - name: Deploy data collection job
        run: |
          gcloud run jobs deploy "${{ env.COLLECT_JOB }}" \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}" \
            --service-account="${{ env.SERVICE_ACCOUNT }}" \
            --task-timeout=3600 \
            --memory=512Mi \
            --cpu=1 \
            --max-retries=1 \
            --set-env-vars="DATABASE_SCHEMA=policritique" \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,MANIFESTO_PROJECT_API_KEY=MANIFESTO_PROJECT_API_KEY:latest" \
            --command=sh \
            --args=-c \
            --args="uv run policritique init-db && uv run policritique collect-elections && uv run policritique collect-members && uv run policritique collect-manifestos"
